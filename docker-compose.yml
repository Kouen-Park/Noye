services:
  qdrant:
    # Pinned: the vector index and its API behavior must stay reproducible
    # across machines. Bump deliberately, then re-verify the collection setup.
    image: qdrant/qdrant:v1.19.1
    ports:
      # The backend uses REST. Keep personal vectors on this computer and do
      # not publish the unused gRPC port.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
